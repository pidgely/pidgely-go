components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: API key `pdg_<prefix>_<secret>`.
  responses:
    Unauthorized:
      description: Missing or restricted credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResendError'
    Forbidden:
      description: Invalid key, unverified domain, plan limit, CSRF or role
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResendError'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResendError'
    Invalid:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResendError'
    TooMany:
      description: Rate limit or quota exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResendError'
  schemas:
    ResendError:
      type: object
      properties:
        statusCode:
          type: integer
        name:
          type: string
          description: Machine-readable error name (validation_error, not_found, missing_api_key, invalid_api_key, restricted_api_key,
            rate_limit_exceeded, daily_quota_exceeded, monthly_quota_exceeded, invalid_idempotent_request, csrf_failed, insufficient_role,
            ...).
        message:
          type: string
      required:
      - statusCode
      - name
      - message
    ObjectId:
      type: object
      properties:
        object:
          type: string
        id:
          type: string
          format: uuid
      required:
      - object
      - id
    Id:
      type: object
      properties:
        id:
          type: string
          format: uuid
      required:
      - id
    Deleted:
      type: object
      properties:
        object:
          type: string
        id:
          type: string
          format: uuid
        deleted:
          type: boolean
      required:
      - object
      - id
      - deleted
    Tag:
      type: object
      properties:
        name:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,256}$
        value:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,256}$
      required:
      - name
      - value
    Attachment:
      type: object
      properties:
        filename:
          type: string
        content:
          type: string
          description: Base64 content. Use either content or path.
        path:
          type: string
          description: http(s) URL downloaded at send time (SSRF-guarded, 40MB budget, no redirects).
        content_type:
          type: string
        content_id:
          type: string
          description: Makes the attachment inline (`cid:` in HTML).
    TemplateRef:
      type: object
      properties:
        id:
          type: string
          description: Template id or alias (published version is used).
        variables:
          type: object
          additionalProperties:
            oneOf:
            - type: string
              maxLength: 2000
            - type: number
      required:
      - id
    SendEmail:
      type: object
      properties:
        from:
          type: string
          description: '`Name <addr@verified-domain>`; may come from the template.'
        to:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
        cc:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
        bcc:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
        reply_to:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
        subject:
          type: string
        html:
          type: string
        text:
          type: string
          description: Generated from html when omitted.
        headers:
          type: object
          additionalProperties:
            type: string
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/Attachment'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        scheduled_at:
          type: string
          description: ISO 8601 or natural language (`in 1 hour`, `tomorrow at 9am`); within 30 days.
        template:
          $ref: '#/components/schemas/TemplateRef'
        topic_id:
          type: string
          description: Not supported yet; a non-empty value is rejected.
        stream:
          type: string
          description: 'Pidgely extension: `transactional` (default) or `broadcast` (adds RFC 8058 unsubscribe).'
          enum:
          - transactional
          - broadcast
      required:
      - to
    BatchResult:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Id'
        errors:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
              message:
                type: string
      required:
      - data
    Email:
      type: object
      properties:
        object:
          type: string
        id:
          type: string
          format: uuid
        message_id:
          type: string
        to:
          type: array
          items:
            type: string
        cc:
          type: array
          items:
            type: string
        bcc:
          type: array
          items:
            type: string
        reply_to:
          type: array
          items:
            type: string
        from:
          type: string
        subject:
          type: string
        html:
          type:
          - string
          - 'null'
        text:
          type:
          - string
          - 'null'
        created_at:
          type: string
