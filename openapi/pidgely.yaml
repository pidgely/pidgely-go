openapi: 3.1.0
info:
  title: Pidgely API (public subset)
  version: 1.0.0
  summary: Resend-compatible email API.
  description: 'Public, Resend-compatible subset of the Pidgely API used to generate the types of the `pidgely` SDK. Errors
    have the shape `{"statusCode","name","message"}`. List endpoints use cursor pagination: `limit` (1-100), `after` and `before`
    take item ids and the response is `{"object":"list","has_more","data"}`.'
  license:
    name: MIT
    identifier: MIT
servers:
- url: https://api.pidgely.com
tags:
- name: API keys
- name: Audiences (legacy)
- name: Broadcasts
- name: Contacts
- name: Domains
- name: Emails
- name: Segments
- name: Suppressions
- name: Templates
- name: Webhooks
paths:
  /api-keys:
    post:
      tags:
      - API keys
      summary: Create an API key
      operationId: post_api_keys
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                permission:
                  type: string
                  enum:
                  - full_access
                  - sending_access
                domain_id:
                  type: string
                  format: uuid
              required:
              - name
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedApiKey'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          $ref: '#/components/responses/TooMany'
      security:
      - apiKey: []
    get:
      tags:
      - API keys
      summary: List API keys
      operationId: get_api_keys
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
        description: Page size (1-100).
      - name: after
        in: query
        schema:
          type: string
          format: uuid
        description: Id of the last item of the previous page (older items).
      - name: before
        in: query
        schema:
          type: string
          format: uuid
        description: Id of the first item of the current page (newer items).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    enum:
                    - list
                  has_more:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApiKey'
                required:
                - object
                - has_more
                - data
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          $ref: '#/components/responses/TooMany'
      security:
      - apiKey: []
  /api-keys/{id}:
    patch:
      tags:
      - API keys
      summary: Rename an API key
      operationId: patch_api_keys_id
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Resource id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
              required:
              - name
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          $ref: '#/components/responses/TooMany'
      security:
      - apiKey: []
    delete:
      tags:
      - API keys
      summary: Revoke an API key
      operationId: delete_api_keys_id
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Resource id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deleted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          $ref: '#/components/responses/TooMany'
      security:
      - apiKey: []
  /audiences:
    post:
      tags:
      - Audiences (legacy)
      summary: Create a audience
      operationId: post_audiences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
              required:
              - name
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                  id:
                    type: string
                    format: uuid
                  name:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          $ref: '#/components/responses/TooMany'
      security:
      - apiKey: []
    get:
      tags:
      - Audiences (legacy)
      summary: List audiences
      operationId: get_audiences
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
        description: Page size (1-100).
      - name: after
        in: query
        schema:
          type: string
          format: uuid
        description: Id of the last item of the previous page (older items).
      - name: before
        in: query
        schema:
          type: string
          format: uuid
        description: Id of the first item of the current page (newer items).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    enum:
                    - list
                  has_more:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Segment'
                required:
                - object
                - has_more
                - data
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          $ref: '#/components/responses/TooMany'
      security:
      - apiKey: []
  /audiences/{id}:
    get:
      tags:
      - Audiences (legacy)
      summary: Retrieve a audience
      operationId: get_audiences_id
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Resource id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Segment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          $ref: '#/components/responses/TooMany'
      security:
      - apiKey: []
    delete:
      tags:
      - Audiences (legacy)
      summary: Delete a audience
      operationId: delete_audiences_id
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Resource id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deleted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          $ref: '#/components/responses/TooMany'
      security:
      - apiKey: []
  /audiences/{id}/contacts:
    get:
      tags:
      - Audiences (legacy)
      summary: List a audience's contacts
      operationId: get_audiences_id_contacts
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Resource id
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
        description: Page size (1-100).
      - name: after
        in: query
        schema:
          type: string
          format: uuid
        description: Id of the last item of the previous page (older items).
      - name: before
        in: query
        schema:
          type: string
          format: uuid
        description: Id of the first item of the current page (newer items).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    enum:
                    - list
                  has_more:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Contact'
                required:
                - object
                - has_more
                - data
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          $ref: '#/components/responses/TooMany'
      security:
      - apiKey: []
    post:
      tags:
      - Audiences (legacy)
      summary: Create a contact in an audience
      operationId: post_audiences_id_contacts
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Resource id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          $ref: '#/components/responses/TooMany'
      security:
      - apiKey: []
  /audiences/{id}/contacts/{key}:
    get:
      tags:
      - Audiences (legacy)
      summary: Retrieve a contact
      operationId: get_audiences_id_contacts_key
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Resource id
      - name: key
        in: path
        required: true
        schema:
          type: string
        description: Contact id or e-mail address
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          $ref: '#/components/responses/TooMany'
      security:
      - apiKey: []
    patch:
      tags:
      - Audiences (legacy)
      summary: Update a contact
      operationId: patch_audiences_id_contacts_key
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Resource id
      - name: key
        in: path
        required: true
        schema:
          type: string
        description: Contact id or e-mail address
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          $ref: '#/components/responses/TooMany'
      security:
      - apiKey: []
    delete:
      tags:
      - Audiences (legacy)
      summary: Delete a contact
      operationId: delete_audiences_id_contacts_key
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Resource id
      - name: key
        in: path
        required: true
        schema:
          type: string
        description: Contact id or e-mail address
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                  contact:
                    type: string
                    format: uuid
                  deleted:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          $ref: '#/components/responses/TooMany'
      security:
      - apiKey: []
  /broadcasts:
    post:
      tags:
      - Broadcasts
      summary: Create a broadcast (optionally send)
      operationId: post_broadcasts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BroadcastInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          $ref: '#/components/responses/TooMany'
      security:
      - apiKey: []
    get:
      tags:
      - Broadcasts
      summary: List broadcasts
      operationId: get_broadcasts
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
        description: Page size (1-100).
      - name: after
        in: query
        schema:
          type: string
          format: uuid
        description: Id of the last item of the previous page (older items).
      - name: before
        in: query
        schema:
          type: string
          format: uuid
        description: Id of the first item of the current page (newer items).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    enum:
                    - list
                  has_more:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Broadcast'
                required:
                - object
                - has_more
                - data
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          $ref: '#/components/responses/TooMany'
      security:
      - apiKey: []
  /broadcasts/{id}:
    get:
      tags:
      - Broadcasts
      summary: Retrieve a broadcast
      operationId: get_broadcasts_id
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Resource id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Broadcast'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          $ref: '#/components/responses/TooMany'
      security:
      - apiKey: []
    patch:
      tags:
      - Broadcasts
      summary: Update a draft broadcast
      operationId: patch_broadcasts_id
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Resource id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BroadcastInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          $ref: '#/components/responses/TooMany'
      security:
      - apiKey: []
    delete:
      tags:
      - Broadcasts
      summary: Delete a broadcast
      operationId: delete_broadcasts_id
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Resource id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deleted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          $ref: '#/components/responses/TooMany'
      security:
      - apiKey: []
  /broadcasts/{id}/cancel:
    post:
      tags:
      - Broadcasts
      summary: Cancel a scheduled or queued broadcast
      operationId: post_broadcasts_id_cancel
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Resource id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          $ref: '#/components/responses/TooMany'
      security:
      - apiKey: []
  /broadcasts/{id}/duplicate:
    post:
      tags:
      - Broadcasts
      summary: Duplicate a broadcast as a draft
      operationId: post_broadcasts_id_duplicate
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Resource id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          $ref: '#/components/responses/TooMany'
      security:
      - apiKey: []
  /broadcasts/{id}/send:
    post:
      tags:
      - Broadcasts
      summary: Send a broadcast now or at scheduled_at
      operationId: post_broadcasts_id_send
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Resource id
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                scheduled_at:
                  type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Id'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          $ref: '#/components/responses/TooMany'
      security:
      - apiKey: []
  /contacts:
    post:
      tags:
      - Contacts
      summary: Create (or update) a contact
      operationId: post_contacts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          $ref: '#/components/responses/TooMany'
      security:
      - apiKey: []
    get:
      tags:
      - Contacts
      summary: List contacts
      operationId: get_contacts
      parameters:
      - name: segment_id
        in: query
        schema:
          type: string
          format: uuid
      - name: audience_id
        in: query
        schema:
          type: string
          format: uuid
        description: Legacy alias of segment_id.
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
        description: Page size (1-100).
      - name: after
        in: query
        schema:
          type: string
          format: uuid
        description: Id of the last item of the previous page (older items).
      - name: before
        in: query
        schema:
          type: string
          format: uuid
        description: Id of the first item of the current page (newer items).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    enum:
                    - list
                  has_more:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Contact'
                required:
                - object
                - has_more
                - data
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          $ref: '#/components/responses/TooMany'
      security:
      - apiKey: []
  /contacts/{key}:
    get:
      tags:
      - Contacts
      summary: Retrieve a contact
      operationId: get_contacts_key
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
        description: Contact id or e-mail address
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
