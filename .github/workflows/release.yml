name: Release

# Go modules are published by pushing a semver tag; there is no registry upload.
#   git tag v0.1.0 && git push origin v0.1.0
# This workflow checks that the tag matches `pidgely.Version`, runs the tests,
# warms the Go module proxy (so pkg.go.dev picks the version up) and creates the
# GitHub release from CHANGELOG.md. No secrets are needed.

on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the GitHub release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Check tag matches pidgely.Version
        run: |
          version="$(sed -n 's/^const Version = "\(.*\)"$/\1/p' pidgely.go)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pidgely.Version $version"
            exit 1
          fi
      - run: go vet ./...
      - run: go test -race ./...
      - name: Warm the Go module proxy
        run: |
          curl -fsS "https://proxy.golang.org/github.com/pidgely/pidgely-go/@v/${GITHUB_REF_NAME}.info" || \
            echo "::warning::proxy.golang.org has not indexed ${GITHUB_REF_NAME} yet; it will on first download"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$(awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## \\[?"v {f=1; next} /^## / && f {exit} f' CHANGELOG.md)"
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "${notes:-See CHANGELOG.md}"
